# te-ui: serves the built app and proxies /v1 to te-api, so the browser talks to
# one origin (no CORS, no API URLs baked into the bundle).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;   # published on :3000; relative redirects keep the port

    # Resolve te-api per request through Docker's DNS, so nginx starts (and keeps
    # serving the app) even while te-api is down or being recreated; those
    # requests get a 502, which the app reports.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $te_api http://te-api:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # GET /v1/trends..., POST /v1/campaigns/draft-block (te-api calls Mailchimp from there)
    location /v1/ {
        proxy_pass $te_api;      # no URI part: the request path is passed through unchanged
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    # Webpack's content-hashed bundles never change under the same name.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
